# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
$comment: |
  NO-REF ruled 2026-08-21 (2026-05-15-000-schema-propagation-from-canonical):
  MIGRATED 2026-07-24 -- diverges from `Skill(llm-discourse-graph)`'s
  shipped schema on purpose; see `repo-weight-derivation.md`. Changes:
  `status` and `likelihood` removed. A disputed inference is disputed by
  a contradiction deduction aimed at it -- the undercut the shipped
  design already supports -- so a stored status was a second
  representation that could disagree with the graph. Retraction is a
  filename suffix rather than a field, for the same reason. Not a `#base`
  extender: the canonical requires the very fields this design removes.
$schema: "http://json-schema.org/draft-07/schema#"
description: >
  Structured inference connecting premises to a conclusion. Entailments
  assert the conclusion follows; contradictions assert it is refuted.
  The body text is the inferential narrative — why these premises
  support or undermine the conclusion.

  This is the only edge a retraction propagates along: support between
  claims lives here and nowhere else.

  A retracted deduction is renamed `NAME.retracted.md`. The inference
  is withdrawn but stays readable, and the broken path makes every
  conclusion that rested on it fail the link check until someone
  revisits it.
type: object
additionalProperties: false
required:
  - conclusion
properties:
  kind:
    description: Whether premises support or contradict the conclusion
    type: string
    enum: [entailment, contradiction]
    default: entailment
  conclusion:
    description: Path to the claim or deduction these premises entail or contradict
    type: string
  premises:
    description: Paths to claims serving as premises
    type: array
    items:
      type: string
  sources:
    description: >
      Paths to sources providing this deduction -- typically the discussion
      participant who asserted the inference (kind user/assistant)
    type: array
    items:
      type: string
  depends:
    description: Paths to nodes this deduction needs context from — not premises
    type: array
    items:
      type: string
  tags:
    description: Topic tags for cross-referencing
    type: array
    items:
      type: string
